name: Vérifications RGPD QG (sans données réelles)

on:
  push:
    branches: [main]
    paths:
      - 'backend/cloudflare/src/worker.js'
      - 'backend/cloudflare/tribunal-worker.js'
      - 'backend/cloudflare/monthly-missions-worker.js'
      - 'dist/qg/tribunal-public.js'
      - 'dist/qg/tribunal.js'
      - 'dist/qg/qg.js'
      - 'dist/app.js'
      - 'dist/wheel-library.mjs'
      - 'dist/warzone-hajin.mjs'
      - 'dist/image-storage.mjs'
      - 'dist/roue.html'
      - 'dist/wheel-multijeux.css'
      - 'dist/qg/monthly-missions.js'
      - 'dist/qg/ranking-rewards.css'
      - 'dist/qg/index.html'
      - 'dist/qg/twitch-auth.js'
      - 'dist/qg/profil.js'
      - 'dist/qg/profil.css'
      - 'dist/qg/qg.css'
      - 'dist/qg/contact.js'
      - 'dist/qg/confidentialite.js'
      - 'dist/qg/confidentialite.css'
      - 'backend/cloudflare/schema.sql'
      - 'backend/cloudflare/migrations/**'
      - 'backend/cloudflare/tests/**'
      - '.github/workflows/qg-privacy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v4
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe du Worker
        run: |
          node --check backend/cloudflare/src/worker.js
          node --check backend/cloudflare/tribunal-worker.js
          node --check backend/cloudflare/monthly-missions-worker.js
          node --check dist/qg/tribunal-public.js
          node --check dist/qg/tribunal.js
          node --check dist/qg/twitch-auth.js
          node --check dist/qg/profil.js
          node --check dist/qg/qg.js
          node --check dist/app.js
          node --check dist/wheel-library.mjs
          node --check dist/warzone-hajin.mjs
          node --check dist/image-storage.mjs
          node --check dist/qg/monthly-missions.js
          node --check dist/qg/confidentialite.js
          node --check dist/qg/contact.js
      - name: Tester en SQLite isolé (aucun accès à D1 de production)
        run: node --experimental-sqlite --test backend/cloudflare/tests/*.test.mjs
