name: Vérifications RGPD QG (sans données réelles)

on:
  push:
    branches: [main]
    paths:
      - 'backend/cloudflare/src/worker.js'
      - 'backend/cloudflare/schema.sql'
      - 'backend/cloudflare/migrations/**'
      - 'backend/cloudflare/tests/**'
      - '.github/workflows/qg-privacy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v4
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe du Worker
        run: node --check backend/cloudflare/src/worker.js
      - name: Tester en SQLite isolé (aucun accès à D1 de production)
        run: node --experimental-sqlite --test backend/cloudflare/tests/privacy.test.mjs
