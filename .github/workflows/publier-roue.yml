name: Publier la roue Ma_JesTik

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Verifier le site original
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/qg/index.html
          test -f dist/qg/qg.js
          test -f dist/qg/twitch-auth.js
          test -f dist/qg/tribunal.js
          test -f dist/style.css
          test -f dist/app.js
          test -f dist/engine.mjs
          test -f dist/image-storage.mjs
          for n in $(seq -w 1 12); do
            test -f "dist/assets/${n}.webp"
          done

      - name: Generer les miniatures Open Graph
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3" "Pillow>=10,<13"
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          social = Path('dist/og')
          expected = {'qg', 'roue', 'defis', 'killathon', 'tribunal', 'classement', 'setup', 'partenaires', 'createur'}
          found = {p.stem for p in social.glob('*.svg')}
          if found != expected:
              raise SystemExit(f'Miniatures manquantes ou inattendues : {expected ^ found}')
          for artwork in sorted(social.glob('*.svg')):
              destination = artwork.with_suffix('.png')
              cairosvg.svg2png(url=str(artwork), write_to=str(destination), output_width=1200, output_height=630)
              with Image.open(destination) as im:
                  if im.size != (1200, 630):
                      raise SystemExit(f'Format incorrect pour {destination}')
              print(f'Miniature creee : {destination} ({destination.stat().st_size} octets)')
          PY

      - name: Generer les icones installables MJ
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('dist/icons/mj-source.webp')
          if not source.is_file():
              raise SystemExit('Logo MJ manquant')
          with Image.open(source) as raw:
              raw.load()
              if raw.size != (192, 192):
                  raise SystemExit('Format source MJ incorrect')
              logo = raw.convert('RGBA')

          folder = Path('dist/icons')
          folder.mkdir(exist_ok=True)
          for size in (16, 32, 48, 180, 192, 512):
              destination = folder / f'icon-{size}.png'
              logo.resize((size, size), Image.Resampling.LANCZOS).save(destination, 'PNG', optimize=True)

          # Android masque parfois les angles : le logo reste entièrement dans sa zone sûre.
          maskable = Image.new('RGBA', (512, 512), (7, 23, 37, 255))
          inner = logo.resize((384, 384), Image.Resampling.LANCZOS)
          maskable.alpha_composite(inner, (64, 64))
          maskable.save(folder / 'icon-512-maskable.png', 'PNG', optimize=True)

          logo.resize((180, 180), Image.Resampling.LANCZOS).save('dist/apple-touch-icon.png', 'PNG', optimize=True)
          favicon = logo.resize((64, 64), Image.Resampling.LANCZOS)
          favicon.save('dist/favicon.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (64, 64)])
          for name in ('icon-192.png', 'icon-512.png', 'icon-512-maskable.png'):
              with Image.open(folder / name) as im:
                  assert im.size == (int(name.split('-')[1].split('.')[0]),) * 2
          print('Icones application MJ produites : favicon.ico, Apple Touch, PNG 16 a 512 et maskable')
          PY

      - name: Préparer la photo HD du vrai setup Ma_JesTik
        shell: bash
        run: |
          python - <<'PY'
          import io
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageOps

          # Source publique du setup personnel validé (1448 x 1086).
          source_url = "https://raw.githubusercontent.com/maroo1103/setup-ma-jestik/main/assets/setup-ma-jestikk.png"
          request = urllib.request.Request(source_url, headers={"User-Agent": "Ma-JesTik-GitHub-Pages"})
          with urllib.request.urlopen(request, timeout=35) as reply:
              image_bytes = reply.read()
          with Image.open(io.BytesIO(image_bytes)) as src:
              im = ImageOps.exif_transpose(src).convert("RGB")
              if min(im.size) < 900:
                  raise RuntimeError(f"Photo source trop petite : {im.size}")
              # Taille d'origine préservée, légère netteté et WebP haute qualité.
              im = im.filter(ImageFilter.UnsharpMask(radius=1.15, percent=118, threshold=3))
              target = Path("dist/qg/media/pc-ma-jestik-hd.webp")
              target.parent.mkdir(parents=True, exist_ok=True)
              im.save(target, "WEBP", quality=93, method=6)
          with Image.open(target) as test:
              if min(test.size) < 900 or target.stat().st_size < 60000:
                  raise RuntimeError("Le visuel HD produit semble trop compressé.")
          print(f"Photo HD du setup : {test.size}, {target.stat().st_size} octets")
          PY

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
