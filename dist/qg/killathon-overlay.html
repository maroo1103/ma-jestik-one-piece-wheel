<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#061b29">
 <meta name="majestik-killathon-api" content="https://ma-jestik-qg-killathon.maroodu11.workers.dev">
 <title>Killathon · Ma_JesTik · OBS</title>
 <link rel="stylesheet" href="killathon-overlay.css?v=20261107-mini1">
 <script type="module" src="killathon-overlay.js?v=20261107-mini1"></script>
</head>
<body>
 <main class="overlay" aria-label="Killathon : compteur et objectif">
  <div class="overlay-header">
   <strong class="overlay-title">KILLATHON</strong>
   <div class="overlay-score" aria-label="Éliminations réalisées et objectif">
    <span id="kills">0</span><span class="overlay-divider" aria-hidden="true">/</span><span id="goal">30</span>
   </div>
  </div>
  <div class="overlay-progress" id="progressTrack" role="progressbar" aria-label="Progression du Killathon" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
   <div id="progress"></div>
  </div>
  <p class="overlay-error" id="error" role="status" hidden></p>
 </main>
</body>
</html>
